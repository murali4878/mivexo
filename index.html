<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- ═══════════════════════════════════════════════════════════
         FAVICON — Google Search Guidelines compliant
         • rel="icon"                  → primary (all modern browsers + Googlebot)
         • rel="shortcut icon"         → legacy browser fallback (also indexed by Google)
         • rel="apple-touch-icon"      → iOS home screen / Apple-touch (indexed by Google)
         • rel="apple-touch-icon-precomposed" → older iOS versions
         Sizes: 512px recommended so Google can scale to any surface.
         File format: PNG (supported by Google: BMP, GIF, ICO, PNG, JPEG, PPM, TIFF)
         URL: stable, absolute-path relative to domain root (/favicon-512.png)
         ═══════════════════════════════════════════════════════════ -->

    <!-- Primary favicon — highest quality, Google uses this for Search results -->
    <link rel="icon" type="image/png" sizes="512x512" href="/favicon-512.png" />
    <link rel="icon" type="image/png" sizes="256x256" href="/favicon-256.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="icon" type="image/png" sizes="96x96"   href="/favicon-96x96.png" />
    <link rel="icon" type="image/png" sizes="32x32"   href="/favicon-32x32.png" />

    <!-- ICO fallback for very old browsers -->
    <link rel="icon"          href="/favicon.ico" sizes="any" />
    <!-- Legacy alias — also recognised by Google -->
    <link rel="shortcut icon" href="/favicon.ico" />

    <!-- Apple touch icons — also indexed by Google for Search results -->
    <link rel="apple-touch-icon"              sizes="512x512" href="/favicon-512.png" />
    <link rel="apple-touch-icon"              sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon-precomposed"  sizes="180x180" href="/apple-touch-icon.png" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="MIVEXO - Learn. Build. Achieve. Premium EdTech platform for online learning, internships, and placement preparation." />
    <meta name="keywords" content="MIVEXO, EdTech, online learning, internships, placement preparation, certificates, courses" />

    <!-- ═══════════════════════════════════════════════════════════
         OPEN GRAPH — WhatsApp / Facebook / LinkedIn / Telegram
         og:image must be 1200×630 px, absolute URL, < 300 KB
         ═══════════════════════════════════════════════════════════ -->
    <meta property="og:type"        content="website" />
    <meta property="og:url"         content="https://mivexo.in/" />
    <meta property="og:title"       content="MIVEXO | Learn. Build. Achieve." />
    <meta property="og:description" content="Master in-demand skills through hands-on projects with expert mentorship." />
    <meta property="og:image"       content="https://mivexo.in/og-image.png" />
    <meta property="og:image:width"  content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type"   content="image/png" />
    <meta property="og:site_name"   content="MIVEXO" />

    <!-- ═══════════════════════════════════════════════════════════
         TWITTER / X CARD — also used by WhatsApp in some versions
         ═══════════════════════════════════════════════════════════ -->
    <meta name="twitter:card"        content="summary_large_image" />
    <meta name="twitter:title"       content="MIVEXO | Learn. Build. Achieve." />
    <meta name="twitter:description" content="Master in-demand skills through hands-on projects with expert mentorship." />
    <meta name="twitter:image"       content="https://mivexo.in/og-image.png" />

    <meta name="theme-color" content="#7C3AED" />
    <title>MIVEXO | Learn. Build. Achieve.</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <!-- Razorpay Standard Web Checkout SDK -->
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
